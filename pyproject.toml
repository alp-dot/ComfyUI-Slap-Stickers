[project]
name = "comfyui-slap-stickers"
version = "0.1.0"
description = "Place image stickers on the surfaces in a photograph using MoGe geometry."
license = "MIT"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
